<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" role="img" aria-label="Onthou maker lab — epcellic">
  <title>Onthou maker lab — epcellic</title>
  <desc>Three horizontal ellipses stacked top to bottom (purple, teal, deep blue) blur into a wide floating capsule.</desc>
  <defs>
    <filter id="diffuse" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <style>
      .b { transform-box: fill-box; transform-origin: center; }
      .b1 { animation: d1 10s ease-in-out infinite; }
      .b2 { animation: d2 13s ease-in-out infinite; }
      .b3 { animation: d3 11s ease-in-out infinite; }
      @keyframes d1 {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50%      { transform: translate(-10px, 6px) scale(1.05); }
      }
      @keyframes d2 {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50%      { transform: translate(10px, -8px) scale(0.95); }
      }
      @keyframes d3 {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50%      { transform: translate(-8px, -10px) scale(1.05); }
      }
      @media (prefers-reduced-motion: reduce) {
        .b1, .b2, .b3 { animation: none; }
      }
    </style>
  </defs>

  <!-- 三层横向椭圆：紫(上) / 青绿(中) / 深蓝(下)，整体形成紧凑的横向胶囊渐变 -->
  <g filter="url(#diffuse)">
    <ellipse class="b b1" cx="300" cy="143" rx="124" ry="64" fill="#6D28D9"/>
    <ellipse class="b b2" cx="300" cy="205" rx="137" ry="71" fill="#0F766E"/>
    <ellipse class="b b3" cx="300" cy="267" rx="124" ry="64" fill="#1E40AF"/>
  </g>

  <!-- 主标题 -->
  <text x="300" y="200"
        text-anchor="middle" dominant-baseline="central"
        font-family="'Segoe UI', system-ui, -apple-system, Helvetica, sans-serif"
        font-size="34" font-weight="700" fill="#FFFFFF" letter-spacing="0.4">Onthou maker lab</text>

  <!-- 副标题 -->
  <text x="300" y="238"
        text-anchor="middle" dominant-baseline="central"
        font-family="'Segoe UI', system-ui, -apple-system, Helvetica, sans-serif"
        font-size="14" font-weight="600" fill="#E5E7EB" letter-spacing="6">epcellic</text>
</svg>